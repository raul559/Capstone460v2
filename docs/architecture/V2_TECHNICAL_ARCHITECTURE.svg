<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100" role="img" aria-labelledby="t">
  <title id="t">SkinAI V2 technical architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#605E5C"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #323130; }
      .h1 { font-size: 30px; font-weight: 600; }
      .sub { font-size: 16px; fill: #605E5C; }
      .zone { font-size: 18px; font-weight: 600; }
      .zsub { font-size: 13px; fill: #605E5C; }
      .card { font-size: 15px; font-weight: 600; }
      .csub { font-size: 12.5px; fill: #605E5C; }
      .chip { font-size: 13px; }
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 12.5px; }
      .step { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .lbl { font-size: 12.5px; fill: #0078D4; font-weight: 600; }
      .leg { font-size: 14px; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#FFFFFF"/>

  <text x="40" y="58" class="h1">SkinAI V2 technical architecture</text>
  <text x="40" y="86" class="sub">How the mobile app, backend, data and outside services fit together</text>

  <text x="100" y="150" class="zone" text-anchor="middle">Users</text>
  <circle cx="100" cy="245" r="16" fill="none" stroke="#0078D4" stroke-width="2.5"/>
  <path d="M70,295 a30,30 0 0 1 60,0" fill="none" stroke="#0078D4" stroke-width="2.5"/>
  <text x="100" y="322" class="card" text-anchor="middle">Patient</text>
  <circle cx="100" cy="425" r="16" fill="none" stroke="#0078D4" stroke-width="2.5"/>
  <path d="M70,475 a30,30 0 0 1 60,0" fill="none" stroke="#0078D4" stroke-width="2.5"/>
  <path d="M92,458 v12 M86,464 h12" stroke="#0078D4" stroke-width="2.5"/>
  <text x="100" y="502" class="card" text-anchor="middle">Clinician</text>
  <line x1="150" y1="380" x2="196" y2="380" stroke="#605E5C" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="200" y="120" width="330" height="640" rx="8" fill="#FAF9F8" stroke="#8A8886" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="220" y="136" width="22" height="36" rx="4" fill="none" stroke="#0078D4" stroke-width="2"/>
  <line x1="228" y1="166" x2="234" y2="166" stroke="#0078D4" stroke-width="2"/>
  <text x="254" y="154" class="zone">Mobile app</text>
  <text x="254" y="172" class="zsub">React Native and Expo</text>

  <rect x="220" y="200" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="200" width="5" height="70" fill="#0078D4"/>
  <text x="238" y="228" class="card">Screens</text>
  <text x="238" y="250" class="csub">Home, scan, questions, results, history</text>

  <rect x="220" y="285" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="285" width="5" height="70" fill="#0078D4"/>
  <text x="238" y="313" class="card">Camera and photo picker</text>
  <text x="238" y="335" class="csub">Framing tips, preview, retake</text>

  <rect x="220" y="370" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="370" width="5" height="70" fill="#0078D4"/>
  <text x="238" y="398" class="card">Symptom questions</text>
  <text x="238" y="420" class="csub">Bleeding, itching, pain, recent changes</text>

  <rect x="220" y="455" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="455" width="5" height="70" fill="#0078D4"/>
  <text x="238" y="483" class="card">Photo checks</text>
  <text x="238" y="505" class="csub">File type, size and dimensions</text>

  <rect x="220" y="540" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="540" width="5" height="70" fill="#0078D4"/>
  <text x="238" y="568" class="card">API client</text>
  <text x="238" y="590" class="csub">Sends requests to the backend</text>

  <rect x="220" y="625" width="290" height="70" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <rect x="220" y="625" width="5" height="70" fill="#0078D4"/>
  <rect x="474" y="650" width="18" height="14" rx="2" fill="none" stroke="#0078D4" stroke-width="2"/>
  <path d="M478,650 v-5 a5,5 0 0 1 10,0 v5" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="238" y="653" class="card">Secure storage</text>
  <text x="238" y="675" class="csub">Keeps the login token on the phone</text>

  <rect x="600" y="120" width="660" height="640" rx="8" fill="#FAF9F8" stroke="#8A8886" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="620" y="138" width="30" height="30" rx="3" fill="none" stroke="#0078D4" stroke-width="2"/>
  <line x1="620" y1="148" x2="650" y2="148" stroke="#0078D4" stroke-width="2"/>
  <line x1="620" y1="158" x2="650" y2="158" stroke="#0078D4" stroke-width="2"/>
  <text x="662" y="154" class="zone">Backend</text>
  <text x="662" y="172" class="zsub">One FastAPI app, written in Python</text>

  <rect x="620" y="195" width="620" height="125" rx="6" fill="#EFF6FC" stroke="#0078D4" stroke-width="1.5"/>
  <text x="636" y="220" class="card">API</text>
  <rect x="636" y="234" width="140" height="30" rx="3" fill="#FFFFFF" stroke="#A9CCEB"/>
  <text x="706" y="254" class="mono" text-anchor="middle">POST /analyses</text>
  <rect x="786" y="234" width="150" height="30" rx="3" fill="#FFFFFF" stroke="#A9CCEB"/>
  <text x="861" y="254" class="mono" text-anchor="middle">GET /analyses/{id}</text>
  <rect x="946" y="234" width="130" height="30" rx="3" fill="#FFFFFF" stroke="#A9CCEB"/>
  <text x="1011" y="254" class="mono" text-anchor="middle">/report</text>
  <rect x="1086" y="234" width="140" height="30" rx="3" fill="#FFFFFF" stroke="#A9CCEB"/>
  <text x="1156" y="254" class="mono" text-anchor="middle">/conversations</text>
  <rect x="636" y="274" width="140" height="30" rx="3" fill="#FFFFFF" stroke="#A9CCEB"/>
  <text x="706" y="294" class="mono" text-anchor="middle">/health</text>
  <rect x="786" y="274" width="440" height="30" rx="3" fill="#FFFFFF" stroke="#0078D4" stroke-dasharray="4 3"/>
  <text x="1006" y="294" class="chip" text-anchor="middle">Login check: confirms the user and who owns each record</text>

  <rect x="620" y="335" width="620" height="153" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-width="1.5"/>
  <text x="636" y="360" class="card">Services</text>
  <rect x="636" y="374" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="731" y="401" class="chip" text-anchor="middle">Analysis</text>
  <rect x="836" y="374" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="931" y="401" class="chip" text-anchor="middle">Model</text>
  <rect x="1036" y="374" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="1131" y="401" class="chip" text-anchor="middle">Image storage</text>
  <rect x="636" y="428" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="731" y="455" class="chip" text-anchor="middle">Reports</text>
  <rect x="836" y="428" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="931" y="455" class="chip" text-anchor="middle">Expert system</text>
  <rect x="1036" y="428" width="190" height="44" rx="4" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="1131" y="455" class="chip" text-anchor="middle">Assistant</text>

  <rect x="620" y="522" width="620" height="220" rx="6" fill="#FFF8F3" stroke="#D83B01" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="636" y="548" class="card" style="fill:#A4262C">Where the risk level is decided</text>
  <rect x="636" y="564" width="150" height="104" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <path d="M700,580 l12,12 l-12,12 l-12,-12 z" fill="none" stroke="#D83B01" stroke-width="2"/>
  <text x="711" y="630" class="card" text-anchor="middle">Photo quality</text>
  <text x="711" y="650" class="csub" text-anchor="middle">Unclear? Retake</text>
  <line x1="786" y1="616" x2="804" y2="616" stroke="#605E5C" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="806" y="564" width="200" height="104" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <g stroke="#D83B01" stroke-width="2" fill="none">
    <circle cx="828" cy="590" r="5"/><circle cx="828" cy="608" r="5"/>
    <circle cx="852" cy="584" r="5"/><circle cx="852" cy="599" r="5"/><circle cx="852" cy="614" r="5"/>
    <circle cx="876" cy="599" r="5"/>
    <path d="M833,590 L847,584 M833,590 L847,599 M833,608 L847,599 M833,608 L847,614 M857,584 L871,599 M857,599 L871,599 M857,614 L871,599"/>
  </g>
  <text x="890" y="596" class="card">ResNet50</text>
  <text x="890" y="614" class="csub">Image model</text>
  <text x="822" y="640" class="csub">Scores the photo against</text>
  <text x="822" y="656" class="csub">7 skin lesion types</text>
  <line x1="1006" y1="616" x2="1024" y2="616" stroke="#605E5C" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="1026" y="564" width="200" height="104" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="1042" y="592" class="card">Expert system</text>
  <text x="1042" y="612" class="csub">Weighs the model scores</text>
  <text x="1042" y="628" class="csub">with the symptoms</text>
  <text x="1042" y="652" class="csub" style="fill:#A4262C;font-weight:600">Sets the risk level</text>
  <rect x="636" y="682" width="590" height="44" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="652" y="709" class="chip">Every result records which model and rule versions produced it</text>

  <rect x="1320" y="120" width="440" height="320" rx="8" fill="#FAF9F8" stroke="#8A8886" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1340" y="154" class="zone">Data</text>
  <rect x="1340" y="195" width="400" height="100" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <g fill="none" stroke="#0078D4" stroke-width="2">
    <ellipse cx="1380" cy="222" rx="20" ry="7"/>
    <path d="M1360,222 v38 a20,7 0 0 0 40,0 v-38"/>
    <path d="M1360,241 a20,7 0 0 0 40,0"/>
  </g>
  <text x="1420" y="232" class="card">PostgreSQL database</text>
  <text x="1420" y="252" class="csub">Accounts, analyses, results and reports</text>
  <rect x="1340" y="315" width="400" height="100" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <g fill="none" stroke="#0078D4" stroke-width="2">
    <path d="M1362,342 h36 l-4,40 h-28 z"/>
    <path d="M1360,342 h40"/>
    <rect x="1374" y="356" width="12" height="10" rx="1"/>
  </g>
  <text x="1420" y="352" class="card">Private photo storage</text>
  <text x="1420" y="372" class="csub">Photos are encrypted and only shared</text>
  <text x="1420" y="390" class="csub">through temporary links</text>

  <rect x="1320" y="470" width="440" height="290" rx="8" fill="#FAF9F8" stroke="#8A8886" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1340" y="504" class="zone">Outside services</text>
  <rect x="1340" y="540" width="400" height="90" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <path d="M1380,560 l6,16 l16,6 l-16,6 l-6,16 l-6,-16 l-16,-6 l16,-6 z" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="1420" y="575" class="card">Gemini</text>
  <text x="1420" y="595" class="csub">Writes a plain-language summary</text>
  <text x="1420" y="613" class="csub" style="fill:#A4262C">Cannot change the risk level</text>
  <rect x="1340" y="650" width="400" height="90" rx="4" fill="#FFFFFF" stroke="#C8C6C4"/>
  <g fill="none" stroke="#0078D4" stroke-width="2">
    <circle cx="1370" cy="695" r="9"/>
    <path d="M1379,695 h26 M1397,695 v8 M1404,695 v6"/>
  </g>
  <text x="1420" y="685" class="card">Sign-in provider</text>
  <text x="1420" y="705" class="csub">Handles login</text>
  <text x="1420" y="723" class="csub">Provider not chosen yet</text>

  <line x1="530" y1="258" x2="616" y2="258" stroke="#0078D4" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="573" y="244" class="lbl" text-anchor="middle">HTTPS</text>
  <circle cx="573" cy="280" r="13" fill="#0078D4"/><text x="573" y="285" class="step" text-anchor="middle">2</text>

  <path d="M365,760 V785 H1540 V744" fill="none" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="900" cy="785" r="13" fill="#0078D4"/><text x="900" y="790" class="step" text-anchor="middle">1</text>
  <text x="922" y="778" class="lbl">Sign in</text>

  <path d="M1226,289 H1310 V357 a8,8 0 0 1 0,16 V577 a8,8 0 0 1 0,16 V695 H1336" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="1310" cy="475" r="13" fill="#0078D4"/><text x="1310" y="480" class="step" text-anchor="middle">3</text>

  <path d="M1226,396 H1282 V365 H1336" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1254" cy="396" r="13" fill="#0078D4"/><text x="1254" y="401" class="step" text-anchor="middle">4</text>

  <line x1="1180" y1="488" x2="1180" y2="520" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="1150" cy="505" r="13" fill="#0078D4"/><text x="1150" y="510" class="step" text-anchor="middle">5</text>

  <line x1="1240" y1="240" x2="1336" y2="240" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1288" cy="240" r="13" fill="#0078D4"/><text x="1288" y="245" class="step" text-anchor="middle">6</text>

  <path d="M1226,450 H1276 V585 H1336" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="1276" cy="530" r="13" fill="#0078D4"/><text x="1276" y="535" class="step" text-anchor="middle">7</text>

  <rect x="40" y="820" width="900" height="250" rx="8" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="60" y="852" class="zone">How one analysis works</text>
  <circle cx="72" cy="882" r="11" fill="#0078D4"/><text x="72" y="887" class="step" text-anchor="middle" style="font-size:12px">1</text>
  <text x="94" y="887" class="leg">The user signs in, and the app keeps the login token on the phone.</text>
  <circle cx="72" cy="910" r="11" fill="#0078D4"/><text x="72" y="915" class="step" text-anchor="middle" style="font-size:12px">2</text>
  <text x="94" y="915" class="leg">The app sends the photo and symptom answers to the backend.</text>
  <circle cx="72" cy="938" r="11" fill="#0078D4"/><text x="72" y="943" class="step" text-anchor="middle" style="font-size:12px">3</text>
  <text x="94" y="943" class="leg">The backend checks the login with the sign-in provider.</text>
  <circle cx="72" cy="966" r="11" fill="#0078D4"/><text x="72" y="971" class="step" text-anchor="middle" style="font-size:12px">4</text>
  <text x="94" y="971" class="leg">If the photo is clear enough, it is saved to private storage.</text>
  <circle cx="72" cy="994" r="11" fill="#0078D4"/><text x="72" y="999" class="step" text-anchor="middle" style="font-size:12px">5</text>
  <text x="94" y="999" class="leg">The model scores the photo, and the expert system sets the risk level.</text>
  <circle cx="72" cy="1022" r="11" fill="#0078D4"/><text x="72" y="1027" class="step" text-anchor="middle" style="font-size:12px">6</text>
  <text x="94" y="1027" class="leg">The result is saved to the database and sent back to the app.</text>
  <circle cx="72" cy="1050" r="11" fill="#0078D4"/><text x="72" y="1055" class="step" text-anchor="middle" style="font-size:12px">7</text>
  <text x="94" y="1055" class="leg">Gemini can add a plain-language summary, but it can't change the result.</text>

  <rect x="980" y="820" width="780" height="250" rx="8" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="1000" y="852" class="zone">Also in the design</text>
  <text x="1000" y="882" class="card">Logging</text>
  <text x="1000" y="902" class="csub">Tracks requests, timing and errors.</text>
  <text x="1000" y="920" class="csub">Never records photos, login tokens or medical history.</text>
  <text x="1000" y="952" class="card">Team workflow</text>
  <text x="1000" y="972" class="csub">Code reviews on GitHub, signed commits and automated tests.</text>
  <rect x="1000" y="990" width="740" height="64" rx="6" fill="#FAF9F8" stroke="#8A8886" stroke-dasharray="6 4"/>
  <text x="1016" y="1015" class="card" style="fill:#605E5C">Later, only if needed</text>
  <text x="1016" y="1036" class="csub">Caching, background processing for the model, and similar-image search.</text>

  <line x1="1480" y1="852" x2="1520" y2="852" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1530" y="857" class="csub">Data flow</text>
  <line x1="1480" y1="876" x2="1520" y2="876" stroke="#0078D4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1530" y="881" class="csub">Call to an outside service</text>
  <rect x="1482" y="894" width="36" height="16" fill="#FFF8F3" stroke="#D83B01" stroke-dasharray="4 3"/>
  <text x="1530" y="907" class="csub">Decides the risk level</text>
</svg>
